<nav class="navbar" [class.transparent]="isTransparent" [class.solid]="!isTransparent">
  <div class="navbar-container">
    <!-- Top Bar -->
    <div class="navbar-top">
      <!-- Search Bar -->
      <div class="search-container">
        <div class="search-wrapper">
         <input
    type="text"
    placeholder="Search your product"
    class="search-input"
    [(ngModel)]="searchQuery"
    (input)="onSearch()"
/>
          <button class="search-button" (click)="onSearch()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Right Side Icons -->
      <div class="nav-icons">
        <!-- Cart Icon with Badge -->
        <button class="nav-icon-btn cart-btn" (click)="goToCart()">
          <div class="icon-wrapper">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
          </div>
        </button>

        <!-- Wishlist Icon -->
        <button class="nav-icon-btn" (click)="goToWishlist()">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
          </svg>
        </button>

        <!-- User Profile -->
        <button class="nav-icon-btn user-btn" (click)="goToProfile()">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span class="username" *ngIf="username">{{ username }}</span>
        </button>
      </div>
    </div>

    <!-- Navigation Links -->
    
    <div class="nav-links">
  <button (click)=" navetohome()" class="nav-link active btn btn-link">Home</button>
  <button (click)=" navtocategories() "  class="nav-link btn btn-link">Categories</button>
  <button (click)=" navtoproducts() " class="nav-link btn btn-link">Products</button>
  <button (click)=" navtoorders() " class="nav-link btn btn-link">Orders</button>
</div>
    
  </div>
</nav>

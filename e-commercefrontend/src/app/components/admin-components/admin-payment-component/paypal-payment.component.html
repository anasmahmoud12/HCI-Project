<!-- paypal-payment.component.html -->
<div class="paypal-payment-container">
  
  <!-- Payment in progress -->
  <div *ngIf="paymentInProgress" class="payment-in-progress">
    <div class="spinner"></div>
    <h3>Processing Payment</h3>
    <p>Please complete the payment in the popup window...</p>
    <p class="hint">Do not close this window until payment is complete</p>
  </div>
  
  <!-- Initial loading -->
  <div *ngIf="loading && !paymentInProgress" class="loading-state">
    <div class="spinner"></div>
    <h3>Preparing Payment</h3>
    <p>Connecting to PayPal...</p>
  </div>
  
  <!-- Success state -->
  <div *ngIf="successMessage" class="success-state">
    <div class="success-icon">✓</div>
    <h3>Payment Successful</h3>
    <p class="success-message">{{ successMessage }}</p>
    <p>Redirecting to orders...</p>
  </div>
  
  <!-- Error state -->
  <div *ngIf="errorMessage && !loading && !paymentInProgress" class="error-state">
    <div class="error-icon">✗</div>
    <h3>Payment Issue</h3>
    <p class="error-message">{{ errorMessage }}</p>
    <p>Returning to orders...</p>
  </div>
  
</div>
